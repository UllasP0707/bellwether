name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The only service the suite needs. Almost everything under test is pure —
    # the generator, the scoring function, the policy gates and the guardrails
    # all run without anything listening on a port — but the stores that persist
    # employees, cursors and interventions have read paths that only a real
    # database exercises, and two bugs got through precisely there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bellwether
          POSTGRES_PASSWORD: bellwether
          POSTGRES_DB: bellwether
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bellwether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BELLWETHER_POSTGRES_DSN: postgresql://bellwether:bellwether@localhost:5432/bellwether

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check bellwether tests

      - name: Format check
        run: ruff format --check bellwether tests

      - name: Type check
        run: mypy bellwether

      - name: Test
        run: pytest -q -m "not spark"

      # The database-backed tests skip themselves when nothing is listening,
      # which is right locally and wrong here: a silent skip in CI is the same
      # as not having written them. Fail if they did not run.
      - name: Assert the database tests actually ran
        run: |
          pytest -q -m postgres --collect-only >/dev/null
          pytest -q -m postgres -p no:cacheprovider --no-header -rs 2>&1 | tee /tmp/pg.log
          if grep -q "skipped" /tmp/pg.log; then
            echo "::error::postgres tests were skipped in CI"
            exit 1
          fi

  # The stream/batch parity comparison, in its own job because it needs a JDK
  # and a 300MB PySpark download that the rest of the suite has no use for.
  #
  # It cannot be a locally-only test. The only JDK on the machine this was
  # written on is 23, which PySpark 3.5 does not support, so without this job
  # the single most load-bearing test in the repo would skip itself everywhere
  # and nobody would find out.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pinned, not "latest". PySpark 3.5 supports 8, 11 and 17; a runner
          # image bumping its default JDK would break this without a commit.
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-spark.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-spark.txt -r requirements-dev.txt

      - name: Stream and batch must agree
        run: |
          pytest -q -m spark -rs --no-header 2>&1 | tee /tmp/spark.log
          if grep -q "skipped" /tmp/spark.log; then
            echo "::error::the parity test skipped itself — no usable JVM"
            exit 1
          fi

  # Infrastructure is validated but never applied -- there is no AWS account
  # attached to this project. `validate` proves the configuration is
  # internally consistent: every reference resolves, every type matches, no
  # resource names a field that does not exist. It does not prove AWS would
  # accept it, and infra/README.md says so in the first table.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Validate
        # -backend=false because the real backend is an S3 bucket configured
        # per environment, and `init` would otherwise need credentials to
        # check syntax.
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kubernetes manifests
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check_manifests.py
