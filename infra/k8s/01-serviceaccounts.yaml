# One service account per component, each bound to the matching IAM role.
#
# This is the Kubernetes half of the least-privilege split in
# infra/terraform/iam.tf. The IAM trust policy pins
# `system:serviceaccount:bellwether:<name>`, so these names are load-bearing:
# renaming one here without renaming it there does not fail loudly, it fails
# as an AccessDenied inside a consumer at 3am.
#
# ACCOUNT_ID is substituted at deploy time from `terraform output
# component_role_arns` rather than committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connector
  namespace: bellwether
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/bellwether-ENV-connector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: normalizer
  namespace: bellwether
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/bellwether-ENV-normalizer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scorer
  namespace: bellwether
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/bellwether-ENV-scorer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intervention
  namespace: bellwether
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/bellwether-ENV-intervention
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: bellwether
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/bellwether-ENV-api
