apiVersion: v1
kind: Namespace
metadata:
  name: bellwether
  labels:
    # Every pod here handles behavioural data about identifiable people, so
    # the namespace refuses anything privileged rather than trusting each
    # deployment to opt out. Enforced, not just audited: `warn` alone means
    # the violation ships and somebody reads about it later.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
