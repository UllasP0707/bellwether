apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bellwether
spec:
  replicas: 3
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/bellwether:VERSION
          args: ["serve", "--host", "0.0.0.0", "--port", "8800", "--metrics-port", "9100"]
          envFrom:
            - configMapRef: {name: bellwether}
            - secretRef: {name: bellwether-db}
            - secretRef: {name: bellwether-api-keys}
          ports:
            - {name: http, containerPort: 8800}
            - {name: metrics, containerPort: 9100}
          # Three replicas rather than an HPA, because the load test says the
          # slow endpoint is bound by a single-process Python fold under the
          # GIL: throughput is flat at ~60 req/s from two clients up, so more
          # replicas is the only thing that helps and autoscaling on CPU would
          # not notice. The real fix is serving that query from the marts.
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bellwether
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: metrics, port: 9100, targetPort: metrics}
