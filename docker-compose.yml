name: bellwether

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.11
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "9092:9092"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bellwether
      POSTGRES_PASSWORD: bellwether
      POSTGRES_DB: bellwether
    ports:
      # Host port is overridable because a developer machine very often already
      # has Postgres on 5432. Override in .env and change the DSN to match.
      - "${BELLWETHER_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bellwether"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${BELLWETHER_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bellwether
      MINIO_ROOT_PASSWORD: bellwetherbellwether
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the lake bucket, then exits. Idempotent.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bellwether bellwetherbellwether &&
      mc mb --ignore-existing local/bellwether-lake &&
      echo 'lake bucket ready'
      "

  # The batch path. Behind a profile so `docker compose up` does not build a
  # JVM image to run a stream, and started on demand:
  #
  #   docker compose run --rm spark pytest -m spark
  #   docker compose run --rm spark python -m bellwether.cli batch score
  #
  # Java 17, because PySpark 3.5 does not support the 23 that is on this
  # machine. Containerising the batch job is cheaper than pinning a second JDK
  # into everyone's shell.
  spark:
    profiles: ["batch"]
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    volumes:
      - .:/app
      # Keep the host's macOS virtualenv out of the container: same path, wrong
      # platform, and importable enough to cause very confusing failures.
      - /app/.venv
    working_dir: /app
    environment:
      BELLWETHER_KAFKA_BOOTSTRAP: redpanda:29092
      BELLWETHER_POSTGRES_DSN: postgresql://bellwether:bellwether@postgres:5432/bellwether
      BELLWETHER_REDIS_URL: redis://redis:6379/0
      BELLWETHER_S3_ENDPOINT: http://minio:9000

volumes:
  pgdata:
  miniodata:
