name: bellwether

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.11
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "9092:9092"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bellwether
      POSTGRES_PASSWORD: bellwether
      POSTGRES_DB: bellwether
    ports:
      # Host port is overridable because a developer machine very often already
      # has Postgres on 5432. Override in .env and change the DSN to match.
      - "${BELLWETHER_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bellwether"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${BELLWETHER_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bellwether
      MINIO_ROOT_PASSWORD: bellwetherbellwether
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the lake bucket, then exits. Idempotent.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bellwether bellwetherbellwether &&
      mc mb --ignore-existing local/bellwether-lake &&
      echo 'lake bucket ready'
      "

  # The batch path. Behind a profile so `docker compose up` does not build a
  # JVM image to run a stream, and started on demand:
  #
  #   docker compose run --rm spark pytest -m spark
  #   docker compose run --rm spark python -m bellwether.cli batch score
  #
  # Java 17, because PySpark 3.5 does not support the 23 that is on this
  # machine. Containerising the batch job is cheaper than pinning a second JDK
  # into everyone's shell.
  spark:
    profiles: ["batch"]
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    volumes:
      - .:/app
      # Keep the host's macOS virtualenv out of the container: same path, wrong
      # platform, and importable enough to cause very confusing failures.
      - /app/.venv
    working_dir: /app
    environment:
      BELLWETHER_KAFKA_BOOTSTRAP: redpanda:29092
      BELLWETHER_POSTGRES_DSN: postgresql://bellwether:bellwether@postgres:5432/bellwether
      BELLWETHER_REDIS_URL: redis://redis:6379/0
      BELLWETHER_S3_ENDPOINT: http://minio:9000

  # Orchestration, also behind a profile. Used with `dags test`, which executes
  # a whole DAG run in one process:
  #
  #   docker compose run --rm airflow airflow dags test bellwether_daily 2026-08-25
  #
  # There is no webserver or scheduler service. Running a DAG is what proves the
  # tasks work; a UI proves only that a UI starts, and the two long-lived
  # processes it needs are a lot of container for that.
  airflow:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/bellwether
      # Host virtualenvs are macOS builds on a Linux container. Same paths,
      # wrong platform, importable enough to fail confusingly.
      - /opt/bellwether/.venv
      - /opt/bellwether/.venv-dbt
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      BELLWETHER_KAFKA_BOOTSTRAP: redpanda:29092
      BELLWETHER_POSTGRES_DSN: postgresql://bellwether:bellwether@postgres:5432/bellwether
      BELLWETHER_REDIS_URL: redis://redis:6379/0
      BELLWETHER_S3_ENDPOINT: http://minio:9000
      # dbt reads these rather than a checked-in credential.
      BELLWETHER_PG_HOST: postgres
      BELLWETHER_PG_PORT: "5432"
    entrypoint: ["/bin/bash", "-c"]
    command: ["airflow db migrate >/dev/null 2>&1 && airflow dags list"]

  # Observability, behind a profile so the everyday stack stays four services.
  #
  #   docker compose --profile observability up -d
  #
  # Prometheus scrapes; nothing pushes. A Pushgateway would be the answer for
  # jobs that exit, and it brings the failure mode worth avoiding here: pushed
  # metrics outlive the process that pushed them, so a dead consumer keeps
  # reporting the last numbers it had. A scrape that fails is unambiguous.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    # The stages run on the host, not in compose, because they are CLI
    # invocations. This is what lets a container scrape them.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      # Provisioned from files rather than clicked together in the UI, so the
      # dashboard is in the diff and survives `docker compose down -v`.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP over HTTP, which is what the exporter speaks

volumes:
  pgdata:
  miniodata:
