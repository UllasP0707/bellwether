# Scrape config for the local stack.
#
# The stages are CLI invocations on the host rather than compose services, so
# they are scraped over host.docker.internal on fixed ports. In a cluster this
# would be one ServiceMonitor selecting a label instead of five static targets
# -- see infra/k8s/. The shape of what is exported is identical either way.
#
# A stage that is not currently running fails its scrape, and that is correct:
# `up == 0` is the signal that the scorer died, and it is the alert worth
# having. Static targets make that visible; service discovery would simply
# stop listing it.
global:
  scrape_interval: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: bellwether
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels: {component: api}
      - targets: ["host.docker.internal:9102"]
        labels: {component: normalizer}
      - targets: ["host.docker.internal:9103"]
        labels: {component: scorer}
      - targets: ["host.docker.internal:9104"]
        labels: {component: intervention}
      - targets: ["host.docker.internal:9105"]
        labels: {component: ingest}
